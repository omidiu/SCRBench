[project]
name = "scrbench"
version = "0.1.0"
description = "A benchmark for reasoning about the semantic effects of code transformations."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Omid Saghatchian" }]
dependencies = [
    "astor==0.8.1",
    "datasets==3.3.1",
    "matplotlib==3.10.3",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "redis==5.2.1",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
]

[build-system]
requires = ["setuptools>=75.8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
